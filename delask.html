<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسح كل AskPharmacy</title>
<style>
body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; text-align: center; background:#f5f5f5; }
button { background:#ff4d4d; color:white; border:none; padding:15px 30px; border-radius:10px; font-size:18px; cursor:pointer; transition:0.2s; }
button:hover { transform: translateY(-2px); }
#msg { margin-top:20px; font-weight:bold; }
</style>
</head>
<body>

<h2>مسح كل الاستعلامات AskPharmacy</h2>
<button onclick="deleteAllAsk()">مسح الكل</button>
<p id="msg"></p>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDlEBzVFhJzFkDI4mWnTSEQbUGOYBoVvbI",
  authDomain: "group-2f790.firebaseapp.com",
  projectId: "group-2f790",
  storageBucket: "group-2f790.firebasestorage.app",
  messagingSenderId: "532610990999",
  appId: "1:532610990999:web:1ad2bf5149c68774e57ad2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function deleteAllAsk(){
  if(!confirm("هل أنت متأكد؟ سيتم مسح كل الاستعلامات!")) return;
  const msgEl = document.getElementById('msg');
  msgEl.innerText = "جاري المسح...";
  try{
    const snap = await db.collection('AskPharmacy').get();
    const batch = db.batch();
    snap.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    msgEl.innerText = "✅ تم مسح كل الاستعلامات بنجاح!";
  } catch(err){
    console.error(err);
    msgEl.innerText = "❌ حدث خطأ أثناء المسح";
  }
}
</script>
<script src="sidebar-menu.js"></script>
</body>
</html>
