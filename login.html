<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - اسأل الصيدلية</title>
    <link rel="icon" type="image/png" href="images/daway_sudan_logo.png">
    <link rel="apple-touch-icon" href="images/daway_sudan_logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        /* تهيئة شاشة الدخول فقط */
        body {
            background: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            flex-direction: column;
        }
        #loginContainer {
            background: white;
            padding: 26px 20px;
            border-radius: 15px;
            max-width: 380px;
            width: 92%;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
            margin-bottom: 16px;
        }
        /* تابات نوع الحساب (تابين واضحين للتنقل بالضغط) */
        .account-tabs-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0 16px;
            padding: 5px;
            background: #eef2f6;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
        }
        .account-tab-btn {
            padding: 10px 8px;
            border: 1.5px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: #475569;
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .account-tab-btn:hover {
            background: rgba(255, 255, 255, 0.65);
            color: #0f172a;
        }
        .account-tab-btn.active {
            background: #ffffff;
            border-color: #00bcd4;
            color: #006064;
            font-weight: 800;
            box-shadow: 0 3px 8px rgba(0, 188, 212, 0.18);
        }
        #phoneInput {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            direction: ltr;
        }

        /* أنماط الشريط الجديد */
        .download-hint-bar {
            background-color: #3f51b5;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            max-width: 350px;
            width: 90%;
            margin: 14px auto 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .download-hint-bar a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            transition: color 0.3s;
            margin-right: 5px;
        }
        .download-hint-bar a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
<div id="loginContainer">
    <img src="images/daway_sudan_logo.png" alt="شعار دواي سودان" style="width: 135px; margin-bottom: 12px;">
    <h3 style="margin: 6px 0 6px;">ما نوع حسابك؟</h3>

    <div class="account-tabs-bar" role="tablist" aria-label="اختيار نوع الحساب">
        <button type="button" id="btnTypeUser" role="tab" aria-selected="true" class="account-tab-btn active" onclick="selectAccountType('user')">
            🔍 أبحث عن دواء
        </button>
        <button type="button" id="btnTypePharmacist" role="tab" aria-selected="false" class="account-tab-btn" onclick="selectAccountType('pharmacist')">
            💊 حساب صيدلي
        </button>
    </div>

    <h4 style="margin: 8px 0 4px;">أدخل رقم هاتفك للمتابعة</h4>
    <input type="tel" id="phoneInput" inputmode="numeric" maxlength="12" placeholder="249XXXXXXXXX" oninput="onPhoneFieldInput(this)">

    <button id="savePhoneButton" onclick="handleLoginSubmit()">تسجيل الدخول</button>
    <p id="phoneError" style="color:#c62828; font-size:13px; font-weight:700; min-height:20px; margin:8px 0 4px;"></p>
    <p style="font-size:12px; color:#555; margin:4px 0 0;">(يجب أن يبدأ بـ 249 ويكون 12 رقماً مثل 249XXXXXXXXX)</p>

    <div class="download-hint-bar">
        لتجربة أسرع حمل التطبيق برابط مباشر
        <a href="https://botel2.netlify.app/daway.html">تنزيل</a> ⬇️
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
<script>
    let selectedAccountType = 'user';

    function selectAccountType(type) {
        selectedAccountType = type === 'pharmacist' ? 'pharmacist' : 'user';
        const isPh = selectedAccountType === 'pharmacist';
        const btnUser = document.getElementById('btnTypeUser');
        const btnPh = document.getElementById('btnTypePharmacist');
        const errEl = document.getElementById('phoneError');

        if (btnUser) {
            btnUser.classList.toggle('active', !isPh);
            btnUser.setAttribute('aria-selected', String(!isPh));
        }
        if (btnPh) {
            btnPh.classList.toggle('active', isPh);
            btnPh.setAttribute('aria-selected', String(isPh));
        }
        if (errEl) errEl.textContent = '';
    }

    function sanitizeSudanPhoneInput(inputEl) {
        if (!inputEl) return;
        let digits = String(inputEl.value || '').replace(/\D/g, '');
        digits = digits.replace(/^0+/, '');
        if (digits.length > 12) digits = digits.slice(0, 12);
        inputEl.value = digits;
        return digits;
    }

    function isValidSudan12Phone(digits) {
        return /^249\d{9}$/.test(String(digits || ''));
    }

    function onPhoneFieldInput(inputEl) {
        sanitizeSudanPhoneInput(inputEl);
        const errEl = document.getElementById('phoneError');
        if (errEl) errEl.textContent = '';
    }

    async function handleLoginSubmit() {
        const errEl = document.getElementById('phoneError');
        const phoneInput = document.getElementById('phoneInput');
        const saveBtn = document.getElementById('savePhoneButton');
        if (errEl) errEl.textContent = '';

        const phone = sanitizeSudanPhoneInput(phoneInput) || '';

        if (!isValidSudan12Phone(phone)) {
            if (errEl) {
                errEl.textContent = 'الرقم غير صحيح: يجب أن يبدأ بـ 249 بدون أصفار وأن يتكون من 12 رقماً تماماً مثل 249XXXXXXXXX';
            }
            if (phoneInput) phoneInput.focus();
            return;
        }

        if (saveBtn) {
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ جاري الدخول...';
        }

        try {
            const nowIso = new Date().toISOString();
            localStorage.setItem('userPhone', phone);

            if (selectedAccountType === 'pharmacist') {
                localStorage.setItem('accountType', 'pharmacist');

                if (typeof db !== 'undefined' && db) {
                    try {
                        const phSnap = await db.collection('pharmacies').doc(phone).get();
                        if (phSnap.exists) {
                            const d = phSnap.data() || {};
                            if (d.name) localStorage.setItem('pharmacyName', String(d.name));
                            if (d.ownerName) localStorage.setItem('pharmacyOwner', String(d.ownerName));
                        }
                        await db.collection('users').doc(phone).set({
                            phone: phone,
                            accountType: 'pharmacist',
                            role: 'pharmacist',
                            updatedAt: nowIso
                        }, { merge: true });
                    } catch (_) {}
                }

                window.location.href = 'addph.html';
                return;
            }

            // حساب مستخدم عادي (باحث عن دواء)
            localStorage.setItem('accountType', 'user');
            localStorage.removeItem('pharmacyName');
            localStorage.removeItem('pharmacyOwner');
            localStorage.removeItem('pharmacyDepartment');

            if (typeof db !== 'undefined' && db) {
                try {
                    await db.collection('users').doc(phone).set({
                        phone: phone,
                        accountType: 'user',
                        role: 'user',
                        updatedAt: nowIso
                    }, { merge: true });
                } catch (_) {}
            }

            window.location.href = 'index.html';
        } catch (err) {
            if (errEl) errEl.textContent = 'تعذر تسجيل الدخول: ' + (err.message || err);
            if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.textContent = 'تسجيل الدخول';
            }
        }
    }

    window.onload = async function() {
        const savedPhone = (localStorage.getItem('userPhone') || '').trim();
        const savedRole = (localStorage.getItem('accountType') || 'user').trim();
        if (savedPhone && isValidSudan12Phone(savedPhone)) {
            window.location.href = savedRole === 'pharmacist' ? 'addph.html' : 'index.html';
            return;
        }
        try {
            if (typeof getUserLocation === 'function') {
                await getUserLocation();
            }
        } catch (_) {}
    };
</script>
<script src="sidebar-menu.js"></script>
</body>
</html>
