<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اسأل الآن</title>
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .box {
      max-width: 480px;
      margin: 30px auto;
      background: #fff;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #0b5ed7;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #198754;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      background: #888;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      background: #eef3f8;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    .reply-item {
      background: #e9f7ef;
      border-right: 4px solid #198754;
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 15px;
    }
    .quote-tag {
      display: inline-block;
      margin-right: 6px;
      padding: 2px 7px;
      font-size: 12px;
      background: #d1e7dd;
      color: #0f5132;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>اسأل سؤالك</h2>
    <textarea id="questionInput" placeholder="اكتب سؤالك هنا بدون تسجيل دخول... مثال: هل يوجد بندول؟"></textarea>
    <button id="sendBtn" onclick="submitQuestion()">إرسال السؤال</button>

    <div id="statusBox" class="status">اكتب سؤالك واضغط إرسال عشان يوصلك الرد هنا.</div>
    <div id="repliesBox"></div>
  </div>

  <script>
    let pollTimer = null;

    async function submitQuestion() {
      const input = document.getElementById('questionInput');
      const btn = document.getElementById('sendBtn');
      const statusBox = document.getElementById('statusBox');
      const repliesBox = document.getElementById('repliesBox');

      const question = input.value.trim();
      if (!question) {
        alert('اكتب السؤال أولاً');
        return;
      }

      if (pollTimer) clearInterval(pollTimer);
      repliesBox.innerHTML = '';
      btn.disabled = true;
      statusBox.textContent = 'جاري إرسال السؤال عبر الجلسات وإغلاقها تلقائياً، ثم انتظار الرد...';

      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();

        if (!data.ok) {
          statusBox.textContent = 'خطأ: ' + (data.error || 'تعذر الإرسال');
          btn.disabled = false;
          return;
        }

        const sentOkCount = (data.question.sentStatus || []).filter(s => s.ok).length;
        statusBox.textContent = `تم الإرسال من (${sentOkCount}) جلسة وإغلاقها. بانتظار الردود...`;
        btn.disabled = false;

        pollReplies(data.questionId);
      } catch (e) {
        statusBox.textContent = 'فشل الاتصال بالسيرفر: ' + e.message;
        btn.disabled = false;
      }
    }

    function pollReplies(questionId) {
      const repliesBox = document.getElementById('repliesBox');
      const statusBox = document.getElementById('statusBox');

      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/question/' + encodeURIComponent(questionId));
          const data = await res.json();
          if (!data.ok) return;

          const replies = data.question.replies || [];
          if (replies.length > 0) {
            statusBox.textContent = `تم استلام (${replies.length}) رد وإغلاق الجلسة المستقبلة:`;
            repliesBox.innerHTML = replies
              .map(r => {
                const qd = r.quotedData || null;
                const quoteBadge = r.isQuotedReply
                  ? '<span class="quote-tag">رد مقتبس على السؤال</span>'
                  : '';
                const quotedDetails = qd
                  ? `<div style="margin-top:6px; font-size:13px; color:#333; background:#f8f9fa; padding:8px; border-radius:5px;">
                       <div><strong>المقتبس:</strong> ${escapeHtml(qd.quotedText || r.quotedText || '')}</div>
                       ${qd.stanzaId ? `<div><strong>معرّف الرسالة (ID):</strong> ${escapeHtml(qd.stanzaId)}</div>` : ''}
                       ${qd.participant ? `<div><strong>المشارك:</strong> ${escapeHtml(qd.participant)}</div>` : ''}
                       ${qd.remoteJid ? `<div><strong>الشات:</strong> ${escapeHtml(qd.remoteJid)}</div>` : ''}
                     </div>`
                  : (r.quotedText
                    ? `<div style="margin-top:6px; font-size:13px; color:#333;"><strong>المقتبس:</strong> ${escapeHtml(r.quotedText)}</div>`
                    : '');
                return `<div class="reply-item"><strong>[${r.sessionId} - ${r.time}]</strong> ${quoteBadge}: ${escapeHtml(r.text)}${quotedDetails}</div>`;
              })
              .join('');
          }
        } catch (_) {}
      }, 1000);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  </script>
<script src="sidebar-menu.js"></script>
</body>
</html>
