<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>تسجيل وعرض الصيدليات</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    background-color: #f5f5f5;
}

h2 { color: #333; text-align: center; margin-bottom: 20px; }

input, button {
    width: 100%;
    max-width: 400px;
    padding: 12px 15px;
    font-size: 16px;
    margin: 5px auto;
    display: block;
    border-radius: 8px;
    border: 2px solid #ddd;
}

input:focus, button:focus { outline: none; border-color: #007bff; }

button {
    background: #25D366;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}

button:hover { transform: translateY(-2px); }

.pharmacy-card {
    background: white;
    margin-bottom: 20px;
    border-radius: 8px;
    padding: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
}

.pharmacy-card b { color: #2c3e50; }
.pharmacy-card p { margin: 0; color: #666; }

.delete-btn, .save-btn {
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    height: 30px;
}

.save-btn { background: #007bff; }

.loading { text-align: center; padding: 40px; font-size: 18px; color: #666; }

@media (max-width: 768px) {
    input, button { max-width: 90%; }
}
</style>
</head>
<body>

<h2>📌 صيدلية جديدة</h2>
<input id="name" placeholder="اسم الصيدلية">
<input id="phone" placeholder="رقم الهاتف">
<input id="chatId" placeholder="خاص بالمبرمج chat id telgram">
<button onclick="getLocation()">📍 تحديد الموقع</button>
<p id="locationStatus"></p>
<button onclick="registerPharmacy()">💾 تسجيل</button>

<h2>📋 الصيدليات المسجلة</h2>
<div id="pharmaciesList">
    <div class="loading">لا توجد صيدليات مسجلة بعد.</div>
</div>

<script>
// ===== إعداد فايربيس =====
const firebaseConfig = {
    apiKey: "AIzaSyDlEBzVFhJzFkDI4mWnTSEQbUGOYBoVvbI",
    authDomain: "group-2f790.firebaseapp.com",
    projectId: "group-2f790",
    storageBucket: "group-2f790.firebasestorage.app",
    messagingSenderId: "532610990999",
    appId: "1:532610990999:web:1ad2bf5149c68774e57ad2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentLocation = null;

// تحديد الموقع
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            currentLocation = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
            };
            document.getElementById('locationStatus').textContent = "✅ الموقع تم تحديده";
        }, () => {
            alert("فشل في تحديد الموقع");
        });
    } else {
        alert("المتصفح لا يدعم GPS");
    }
}

// تسجيل الصيدلية
async function registerPharmacy() {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const chatId = document.getElementById('chatId').value.trim();

    if (!name || !phone) return alert("⚠️ أدخل الاسم ورقم الهاتف");
    if (!currentLocation) return alert("⚠️ حدد الموقع أولاً");

    try {
        await db.collection("pharmacies").doc(phone).set({
            name: name,
            phone: phone,
            chatId: chatId || "",
            lat: currentLocation.lat,
            lng: currentLocation.lng,
            createdAt: Date.now()
        });
        alert("✅ تم تسجيل الصيدلية بنجاح!");
        document.getElementById('name').value = "";
        document.getElementById('phone').value = "";
        document.getElementById('chatId').value = "";
        document.getElementById('locationStatus').textContent = "";
        loadPharmacies();
    } catch (err) {
        console.error(err);
        alert("❌ فشل التسجيل، حاول مرة أخرى");
    }
}

// حذف الصيدلية
async function deletePharmacy(docId) {
    if(!confirm("هل أنت متأكد من حذف هذه الصيدلية؟")) return;
    try {
        await db.collection("pharmacies").doc(docId).delete();
        alert("✅ تم مسح الصيدلية بنجاح!");
        loadPharmacies();
    } catch(err) {
        console.error(err);
        alert("❌ فشل المسح، حاول مرة أخرى");
    }
}

// حفظ التعديلات
async function savePharmacy(docId, nameInput, phoneInput, chatInput) {
    const updatedName = nameInput.value.trim();
    const updatedPhone = phoneInput.value.trim();
    const updatedChat = chatInput.value.trim();

    if(!updatedName || !updatedPhone) return alert("⚠️ أدخل الاسم ورقم الهاتف");

    try {
        await db.collection("pharmacies").doc(docId).update({
            name: updatedName,
            phone: updatedPhone,
            chatId: updatedChat
        });
        alert("✅ تم تحديث الصيدلية!");
        loadPharmacies();
    } catch(err) {
        console.error(err);
        alert("❌ فشل التحديث، حاول مرة أخرى");
    }
}

// تحميل الصيدليات وعرضها
async function loadPharmacies() {
    const list = document.getElementById("pharmaciesList");
    list.innerHTML = "";

    try {
        const snapshot = await db.collection("pharmacies").orderBy("createdAt","desc").get();
        if(snapshot.empty){
            list.innerHTML = "<p>لا توجد صيدليات مسجلة حتى الآن.</p>";
            return;
        }

        snapshot.forEach(doc => {
            const ph = doc.data();
            const docId = doc.id;
            const lat = ph.lat !== undefined ? ph.lat.toFixed(4) : "غير محدد";
            const lng = ph.lng !== undefined ? ph.lng.toFixed(4) : "غير محدد";

            const div = document.createElement("div");
            div.className = "pharmacy-card";

            // الحقول مع سطر جديد
            const nameInput = document.createElement("input");
            nameInput.value = ph.name || "";
            const phoneInput = document.createElement("input");
            phoneInput.value = ph.phone || "";
            const chatInput = document.createElement("input");
            chatInput.value = ph.chatId || "";

            div.appendChild(nameInput);
           
            div.appendChild(phoneInput);
         
            div.appendChild(chatInput);
           

            const info = document.createElement("p");
            info.innerHTML = `📍 Lat: ${lat}, Lng: ${lng}`;
            div.appendChild(info);

            // أزرار أسفل الحقول
            const buttonsDiv = document.createElement("div");
            buttonsDiv.style.marginTop = "10px";
            buttonsDiv.style.display = "flex";
            buttonsDiv.style.gap = "10px";

            const saveBtn = document.createElement("button");
            saveBtn.className = "save-btn";
            saveBtn.textContent = "💾";
            saveBtn.style.width = "30px";
            saveBtn.onclick = () => savePharmacy(docId, nameInput, phoneInput, chatInput);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "❌";
            deleteBtn.style.width = "30px";
            deleteBtn.onclick = () => deletePharmacy(docId);

            buttonsDiv.appendChild(saveBtn);
            buttonsDiv.appendChild(deleteBtn);
            div.appendChild(buttonsDiv);

            list.appendChild(div);
        });

    } catch (err) {
        console.error("خطأ عند تحميل الصيدليات:", err);
        list.innerHTML = "<p>❌ فشل في تحميل الصيدليات</p>";
    }
}

loadPharmacies();
</script>

</body>
</html>
