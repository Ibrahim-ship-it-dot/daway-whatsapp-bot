<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دواي السودان - غير متصل</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(180deg, #001020, #002b4a);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 20px;
    }
    img {
      width: 130px;
      height: auto;
      margin-bottom: 25px;
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #00bcd4;
    }
    p {
      font-size: 1.1rem;
      color: #cfd8dc;
      max-width: 320px;
      line-height: 1.6;
    }
    button {
      margin-top: 25px;
      background-color: #00bcd4;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #0097a7;
      transform: scale(1.05);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <img src="images/icons/offline-icon.png" alt="Daway Sudan">
  <h1>🚫 لا يوجد اتصال بالإنترنت</h1>
  <p>يبدو أنك غير متصل حالياً.  
  يرجى التحقق من الشبكة وإعادة المحاولة لاحقاً.</p>
  <button onclick="location.reload()">🔄 إعادة المحاولة</button>
<script src="sidebar-menu.js"></script>
</body>
</html>
