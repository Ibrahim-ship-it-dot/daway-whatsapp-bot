<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إرسال الاستعلام - سيرفر Render</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #f4f7f6;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        button {
            background: #25D366;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }
        #result {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            margin-top: 15px;
            white-space: pre-wrap;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🧪 اختبار إرسال واستعلام الواتساب</h2>
        
        <label>اسم الدواء:</label>
        <input type="text" id="medName" value="باراسيتامول">

        <label>رقم هاتف المستعلم (هاتفك):</label>
        <input type="text" id="userPhone" value="249964785324">

        <button onclick="sendTestRequest()">إرسال الاستعلام لسيرفر Render</button>

        <h3>نتيجة الرد من السيرفر:</h3>
        <div id="result">في انتظار الإرسال...</div>
    </div>

    <script>
        const RENDER_URL = "https://daway-whatsapp-bot.onrender.com/send";

        async function sendTestRequest() {
            const medicine = document.getElementById('medName').value.trim();
            const userPhone = document.getElementById('userPhone').value.trim();
            const resultDiv = document.getElementById('result');

            resultDiv.textContent = "⏳ جاري إرسال الطلب إلى سيرفر Render...";

            try {
                const response = await fetch(RENDER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        medicine: medicine,
                        userPhone: userPhone,
                        askId: "MANUAL_TEST_" + Date.now(),
                        lat: 15.6322,
                        lng: 32.5939,
                        range: 50 // نطاق واسع عشان نضمن صيدلية المايقومة تقع جواهو
                    })
                });

                const data = await response.json();
                resultDiv.textContent = "✅ استجابة السيرفر:\n" + JSON.stringify(data, null, 2);
                
                // بعد تضغط زر الإرسال، ارفع عينك فوراً لسيرفر Render وشوف الـ Logs طبعت شنو!
            } catch (error) {
                resultDiv.textContent = "❌ حدث خطأ في الاتصال:\n" + error.message;
            }
        }
    </script>
</body>
</html>
